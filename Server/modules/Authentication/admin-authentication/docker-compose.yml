version: "3.9"

services:
  dockermongo:
    container_name: dockermongo
    image: mongo:6
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongo_data:/data/db
      
  mongo-express:
    container_name: mongoexpress
    image: mongo-express:1.0.2
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_SERVER: dockermongo
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_AUTH_DATABASE: admin
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - dockermongo
  authadmin:
    container_name: authadmin
    build: .
    ports:
      - "8001:8001"
    environment:
      PORT: 8001
      URL: mongodb://admin:password@dockermongo:27017/authdb?authSource=admin
      GOOGLE_CLIENT_ID: 257012792582-nrmbd7cggnqoo60bine30lpfjtld7j4l.apps.googleusercontent.com
      JWT_SECRET: mysecret
    depends_on:
      - dockermongo
    restart: always

volumes:
  mongo_data:
